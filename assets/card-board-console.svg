<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-label="board-console: self-hosted web admin panel for Raspberry Pi, Rock 5B and other Linux boards over SSH">
<defs><linearGradient id="neon" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox" spreadMethod="reflect">
  <stop offset="0" stop-color="#00f0ff"/><stop offset=".5" stop-color="#ff2bd6"/><stop offset="1" stop-color="#39ff88"/>
  <animate attributeName="x1" values="-1;1;-1" dur="8s" repeatCount="indefinite"/>
  <animate attributeName="x2" values="0;2;0" dur="8s" repeatCount="indefinite"/>
</linearGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect x="2" y="2" width="996" height="226" rx="18" fill="#070a14" stroke="url(#neon)" stroke-width="3"/>
<g><rect x="26" y="26" width="196" height="178" rx="12" fill="#0b1224" stroke="#26436b"/><circle cx="44" cy="42" r="5" fill="#39ff88"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" repeatCount="indefinite"/></circle><text x="58" y="47" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" fill="#8ba3c7">rock5b:ssh</text><text x="42" y="71" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" fill="#8ba3c7">CPU</text><rect x="82" y="58" width="124" height="15" rx="4" fill="#142038"/><rect x="82" y="58" width="40" height="15" rx="4" fill="#00f0ff"><animate attributeName="width" values="40;118;52;104;40" dur="2.6s" repeatCount="indefinite"/></rect><text x="42" y="105" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" fill="#8ba3c7">MEM</text><rect x="82" y="92" width="124" height="15" rx="4" fill="#142038"/><rect x="82" y="92" width="70" height="15" rx="4" fill="#ff2bd6"><animate attributeName="width" values="70;104;82;90;70" dur="3.7s" repeatCount="indefinite"/></rect><text x="42" y="139" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" fill="#8ba3c7">TMP</text><rect x="82" y="126" width="124" height="15" rx="4" fill="#142038"/><rect x="82" y="126" width="54" height="15" rx="4" fill="#39ff88"><animate attributeName="width" values="54;92;66;78;54" dur="4.9s" repeatCount="indefinite"/></rect><text x="42" y="173" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" fill="#8ba3c7">DSK</text><rect x="82" y="160" width="124" height="15" rx="4" fill="#142038"/><rect x="82" y="160" width="82" height="15" rx="4" fill="#00f0ff"><animate attributeName="width" values="82;88;94;74;82" dur="7.1s" repeatCount="indefinite"/></rect></g>
<g font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace">
<text x="262" y="62" font-size="38" font-weight="800" fill="url(#neon)">board-console</text>
<text x="262" y="108" font-size="26" fill="#e6edf3">Web admin panel for single-board computers.</text>
<text x="262" y="145" font-size="26" fill="#e6edf3">Runs on your PC. Nothing to install on the boards.</text>
<rect x="262" y="172" width="114" height="36" rx="18" fill="#0f1a30" stroke="#26436b"/><text x="319" y="197" font-size="21" fill="#00f0ff" text-anchor="middle">Node.js</text><rect x="388" y="172" width="64" height="36" rx="18" fill="#0f1a30" stroke="#26436b"/><text x="420" y="197" font-size="21" fill="#00f0ff" text-anchor="middle">SSH</text><rect x="464" y="172" width="102" height="36" rx="18" fill="#0f1a30" stroke="#26436b"/><text x="515" y="197" font-size="21" fill="#00f0ff" text-anchor="middle">Docker</text><rect x="578" y="172" width="114" height="36" rx="18" fill="#0f1a30" stroke="#26436b"/><text x="635" y="197" font-size="21" fill="#00f0ff" text-anchor="middle">systemd</text>
</g>
</svg>
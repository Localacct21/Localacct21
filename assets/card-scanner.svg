<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-label="Simple-Global-Minecraft-Scanner: shell script that uses Masscan to find Minecraft servers on public IPv4">
